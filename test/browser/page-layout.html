<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Keyline page width and horizontal padding regression</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 16px; font-family: -apple-system, sans-serif; color: var(--text-normal); }
    .controls { display: flex; gap: 24px; margin-bottom: 16px; align-items: center; }
    label { display: flex; gap: 8px; align-items: center; }
    .pane, #preview { width: var(--fixture-pane-width, 1200px); margin-bottom: 16px; }
    .caption { font-size: 12px; color: var(--text-muted); margin: 8px 0; }
    .view-content > .markdown-source-view.mod-cm6 > .cm-editor > .cm-scroller { padding: var(--file-margins); }
    .markdown-preview-view { width: 100%; padding: var(--file-margins); }
    .cm-sizer, .markdown-preview-sizer { width: 100%; }
    .markdown-source-view.mod-cm6.is-readable-line-width .cm-sizer,
    .markdown-preview-view.is-readable-line-width .markdown-preview-sizer { max-width: var(--file-line-width); margin-inline: auto; }
    .markdown-source-view.mod-cm6.is-readable-line-width .cm-content,
    .markdown-source-view.mod-cm6.is-readable-line-width .cm-line { max-width: var(--file-line-width); }
    .cm-sizer, .markdown-preview-sizer { outline: 1px dashed var(--background-modifier-border); }
    .markdown-preview-sizer p { margin: 0; }
    #result { font: 12px/1.5 monospace; white-space: pre-wrap; }
  </style>
  <link rel="stylesheet" href="../../../theme/Keyline/theme.css">
  <link rel="stylesheet" href="../../styles.css">
</head>
<body class="theme-dark" data-result="pending">
  <div class="controls">
    <label>正文最大宽度 <input id="width" type="range" min="320" max="1600" step="20" value="600"><output id="width-value">600px</output></label>
    <label>左右留白 <input id="padding" type="range" min="-1" max="160" step="1" value="-1"><output id="padding-value">自动</output></label>
  </div>
  <div id="panes"></div>
  <div class="ncl-theme-layout-preview" id="preview">
    <div class="ncl-theme-layout-preview-label">设置即时预览</div>
    <div class="ncl-theme-layout-preview-canvas"><div class="ncl-theme-layout-preview-content">正文宽度、左右留白同步变化。自动模式保留原来的自适应边距。</div></div>
  </div>
  <pre id="result">pending</pre>
  <script src="../.build/pageLayoutFixture.js"></script>
</body>
</html>

name: CI

# Branch pushes and pull requests only. Releases are a separate workflow keyed
# on tags, so nothing here can publish anything.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm pretest && pnpm test

      # Safe on CI: esbuild.config.mjs guards the vault mirror with
      # fs.existsSync, so a production build with no vault present just writes
      # main.js to the repo root.
      - name: Build
        run: pnpm build
